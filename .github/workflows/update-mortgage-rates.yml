name: Update mortgage-rate defaults

on:
  schedule:
    - cron: '15 18 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Freddie Mac PMMS
        run: node scripts/update-mortgage-rates.mjs
      - name: Commit a changed rate file
        run: |
          if git diff --quiet -- src/data/mortgage-rates.json; then
            echo "No rate change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/mortgage-rates.json
          git commit -m "Update Freddie Mac mortgage-rate defaults"
          git push
